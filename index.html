<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PanFood</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>🥗 PanFood</h1>

<div class="menu">

<button onclick="showPage('home')">
🏠 Analisar
</button>

<button onclick="showPage('profile')">
👤 Perfil
</button>

</div>

</header>

<div class="container">

<section id="homePage">

<div class="card">

<h2>O que vai comer?</h2>

<textarea
id="meal"
placeholder="Ex: hambúrguer com batatas fritas e coca cola">
</textarea>

<button onclick="analyzeMeal()">
Analisar
</button>

<div id="result"></div>

</div>

</section>

<section
id="profilePage"
style="display:none"
>

<div class="card">

<h2>Perfil</h2>

<label>Peso Atual</label>
<input type="number" id="weight">

<label>Peso Objetivo</label>
<input type="number" id="targetWeight">

<label>Triglicéridos</label>
<input type="number" id="triglycerides">

<label>HDL</label>
<input type="number" id="hdl">

<label>
<input
type="checkbox"
id="pancreatitis">
Histórico de Pancreatite
</label>

<br><br>

<button onclick="saveProfile()">
Guardar Perfil
</button>

</div>

<div class="card">

<h2>Histórico de Peso</h2>

<input
id="newWeight"
type="number"
placeholder="Novo Peso">

<button onclick="addWeight()">
Guardar Peso
</button>

<ul id="weightHistory"></ul>

</div>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
